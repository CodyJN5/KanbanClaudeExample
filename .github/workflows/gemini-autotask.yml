name: "Gemini Task Breakdown"

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  analyze_task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Issue Details
        id: issue_details
        run: |
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV

      - name: Call Gemini API and Write to File
        id: gemini
        run: |
          # The prompt is set to return only a checklist for the health project
          PROMPT="Analyze the following task for a health informatics project and provide only a Markdown checklist of 3-5 technical subtasks. Do not include an introduction or conclusion. Task Title: '${{ env.ISSUE_TITLE }}'."
          
          JSON_PAYLOAD=$(jq -n \
                            --arg content "$PROMPT" \
                            '{contents: [{parts: [{text: $content}]}]}')

          # Use the stable flash model for fast response
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"

          API_RESPONSE=$(curl -s -X POST "$API_URL" \
                            -H "Content-Type: application/json" \
                            -H "x-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" \
                            -d "$JSON_PAYLOAD")

          GENERATED_TEXT=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

          if [ "$GENERATED_TEXT" == "null" ]; then
            GENERATED_TEXT="Error generating subtasks. Please check API key and GitHub Action logs."
          fi
          
          # Build the comment body
          BODY="### 🛠 Suggested Subtasks
          
          $GENERATED_TEXT"
          
          echo "$BODY" > comment-body.txt

      - name: Post Checklist as Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uses the GitHub CLI to post the file content as a comment
          gh issue comment ${{ env.ISSUE_NUMBER }} --body-file comment-body.txt
