name: "Gemini Task Breakdown"

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  analyze_task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Issue Details
        id: issue_details
        run: |
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV

      - name: Call Gemini API and Write to File
        id: gemini
        run: |
          PROMPT="Analyze the following task and provide a Markdown checklist of 3-5 subtasks. Task Title: '${{ env.ISSUE_TITLE }}'."
          
          # We've put this on one line to avoid the 'command not found' error
          JSON_PAYLOAD=$(jq -n --arg content "$PROMPT" '{contents: [{parts: [{text: $content}]}]}')

          # Using the v1 stable endpoint which is more reliable for Flash
          API_URL="https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent"

          API_RESPONSE=$(curl -s -X POST "$API_URL" -H "Content-Type: application/json" -H "x-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" -d "$JSON_PAYLOAD")

          GENERATED_TEXT=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

          if [ "$GENERATED_TEXT" == "null" ] || [ -z "$GENERATED_TEXT" ]; then
            GENERATED_TEXT="Sorry, Gemini couldn't generate a response. Details: $(echo $API_RESPONSE | jq -r '.error.message')"
          fi
          
          echo "### 🛠 Suggested Subtasks" > comment-body.txt
          echo "" >> comment-body.txt
          echo "$GENERATED_TEXT" >> comment-body.txt

      - name: Post Checklist as Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ env.ISSUE_NUMBER }} --body-file comment-body.txt
