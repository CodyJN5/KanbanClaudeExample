name: "Gemini Task Breakdown"

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  analyze_task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Issue Details
        id: issue_details
        run: |
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV

      - name: Call Gemini API and Write to File
        id: gemini
        run: |
          # Simplified prompt to get just the subtasks
          PROMPT="Analyze the following task and provide only a Markdown checklist of 3-5 technical subtasks. Do not include an introduction. Task Title: '${{ env.ISSUE_TITLE }}'."
          
          JSON_PAYLOAD=$(jq -n \
                            --arg content "$PROMPT" \
                            '{contents: [{parts: [{text: $content}]}]}')

          # Use the 1.5-flash model which is the current stable free-tier model
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"

          API_RESPONSE=$(curl -s -X POST "$API_URL" \
                            -H "Content-Type: application/json" \
                            -H "x-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" \
                            -d "$JSON_PAYLOAD")

          GENERATED_TEXT=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

          if [ "$GENERATED_TEXT" == "null" ]; then
            # This helps you see the ACTUAL error from Google in your logs
            GENERATED_TEXT="Sorry, I couldn't generate a response. API Error: $(echo $API_RESPONSE | jq -r '.error.message')"
          fi
          
          BODY="**🤖 Gemini Task Breakdown:**

          $GENERATED_TEXT"
          
          echo "$BODY" > comment-body.txt

      - name: Post Checklist as Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ env.ISSUE_NUMBER }} --body-file comment-body.txt
